services:

  api:
    build: .
    container_name: todo-api
    ports:
      - "8001:8000"
    env_file:
      - .env.docker
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: todo-postgres
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    ports:
      - "5434:5432"
    volumes:
      - todo_postgres_data:/var/lib/postgresql/data

volumes:
  todo_postgres_data: